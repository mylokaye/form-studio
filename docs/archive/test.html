    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #fff;
        --d365-layout-width: 600px;
        --card-padding-inline: clamp(1.5rem, 5vw, 2.5rem);
        --card-border-width: 1px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1rem;
        display: grid;
        place-items: center;
      }

      .form-card {
        /* D365's 600px layout width is the inner content width. */
        width: min(
          100%,
          calc(
            var(--d365-layout-width) + var(--card-padding-inline) + var(--card-padding-inline) +
              var(--card-border-width) + var(--card-border-width)
          )
        );
        padding: var(--card-padding-inline);
        background: #fff;
        border: var(--card-border-width) solid #dbe3ec;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(31 41 55 / 8%);
      }

      [data-editorblocktype="Text"] h1 {
        margin: 0 0 0.5rem;
        color: #111827;
        font-size: clamp(1.6rem, 4vw, 2rem);
      }

      [data-editorblocktype="Text"] p {
        margin: 0 0 1.5rem;
        color: #667085;
      }

      .form-fields {
        display: grid;
        gap: 16px;
      }

      .form-fields > .wrap-section:first-child {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .columnContainer {
        min-width: 0;
        
      }

      .textFormFieldBlock {
        display: grid;
        gap: 0.45rem;
      }

      .textFormFieldBlock label {
        color: #344054;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .textFormFieldBlock input {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.7rem 0.8rem;
        color: inherit;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font: inherit;
      }

      .textFormFieldBlock input:focus {
        outline: 3px solid rgb(59 130 246 / 25%);
        border-color: #2563eb;
      }

      .textFormFieldBlock input:user-invalid {
        border-color: #d92d20;
      }

      .submitButtonWrapper {
        margin-top: 1.25rem;
      }

      .submitButton {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.7rem 1rem;
        color: #fff;
        background: #2563eb;
        border: 0;
        border-radius: 7px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .submitButton:hover {
        background: #1d4ed8;
      }

      .submitButton:focus-visible {
        outline: 3px solid rgb(59 130 246 / 35%);
        outline-offset: 2px;
      }

      .form-status {
        margin: 1rem 0 0;
        padding: 0.75rem 1rem;
        border-radius: 7px;
      }

      .form-status--success {
        color: #166534;
        background: #f0fdf4;
      }

      @media (max-width: 480px) {
        .form-fields > .wrap-section:first-child {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

          </div>

          <p class="form-status form-status--success" data-form-status="" role="status" hidden=""></p>

    </main>

    <script>
      const form = document.querySelector("[data-demo-form]");
      const status = document.querySelector("[data-form-status]");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const firstName = form.elements.firstname.value.trim();
        status.textContent = `Thanks, ${firstName}. Your form was submitted.`;
        status.hidden = false;
      });
    </script>
