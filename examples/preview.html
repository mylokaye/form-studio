<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamics form styling preview</title>
  <style>
    :root { font: 15px/1.5 system-ui, sans-serif; color: #1e293b; background: #f4f6fa; }
    body { margin: 0; padding: clamp(16px, 4vw, 40px); }
    main { max-width: 1480px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 36px); }
    .intro { max-width: 70ch; color: #475569; }
    .examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    section { min-width: 0; }
    h2 { font-size: 18px; }
    iframe { box-sizing: border-box; width: 100%; height: 1400px; background: white; border: 1px solid #dce3ed; border-radius: 12px; }
    .preview-status { min-height: 1.5em; font-weight: 600; }
    @media (max-width: 900px) { .examples { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Dynamics form styling preview</h1>
    <p class="intro">The same example form before and after styling. These samples use synthetic values. Preview submissions stay in your browser; test your own form through Dynamics before publishing.</p>
    <div class="examples">
      <section><h2>Original appearance</h2><iframe src="restyle/original.html" title="Original form example"></iframe></section>
      <section><h2>Styled appearance</h2><iframe src="restyle/styled.html" title="Styled form example"></iframe></section>
    </div>
    <p class="preview-status" role="status" aria-live="polite"></p>
  </main>
  <script>
    // Preview-only interception lives in this harness, never in paste-back HTML.
    for (const frame of document.querySelectorAll("iframe")) {
      frame.addEventListener("load", () => {
        frame.contentDocument?.querySelector("form")?.addEventListener("submit", (event) => {
          event.preventDefault();
          document.querySelector(".preview-status").textContent = "Preview only: no submission was sent. Use Dynamics to verify submission.";
        });
      });
    }
  </script>
</body>
</html>
